# Crypto key initialization messages (startup guard, notice page, init-crypto-key tool)
# Read by the application MessageSource (comCmm.cryptoKey.*) and by java.util.ResourceBundle in the CLI tool (initCryptoKey.*).
# Do not use single quotes - the texts are formatted with java.text.MessageFormat.
comCmm.cryptoKey.guard.log.title=[eGovFrame common components] The crypto key settings are not safe. Every request receives a notice page until the key is initialized.
comCmm.cryptoKey.problem.noConfig=The crypto configuration (egovCryptoConfig) was not found.
comCmm.cryptoKey.problem.defaultKey=algorithmKey is the published default value (egovframe). This also happens when the configuration file path is wrong, because the runtime falls back to the default.
comCmm.cryptoKey.problem.defaultKeyHash=algorithmKeyHash is the hash of the published default key.
comCmm.cryptoKey.problem.mismatch=algorithmKey and algorithmKeyHash do not match (the hash is derived from the key).
comCmm.cryptoKey.configPath=Configuration file : {0}
comCmm.cryptoKey.configPath.default=(Globals.CryptoConfigPath not set - runtime default path)
comCmm.cryptoKey.action=What to do : run ./init-crypto-key.sh (Windows: init-crypto-key.bat) in the project root, then rebuild and restart the server.
comCmm.cryptoKey.guide=Guide : README.md "Security notes"
comCmm.cryptoKey.page.title=Crypto key initialization required
comCmm.cryptoKey.page.reason=This application still uses the default crypto key (egovframe) that is published in the public repository. Anyone can decrypt the DB passwords and other values encrypted with it, so the service is not provided until the key is changed.
comCmm.cryptoKey.page.problems=Detected problems
comCmm.cryptoKey.page.steps=How to fix
comCmm.cryptoKey.page.step1=Run the key initialization tool in the project root.
comCmm.cryptoKey.page.step2=Rebuild the application and restart the server.
comCmm.cryptoKey.page.step3=Do not commit the initialized files (egov-crypto-config.properties, globals.properties) to a public repository.
comCmm.cryptoKey.page.more=See "Security notes" in README.md for details.
