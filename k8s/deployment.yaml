apiVersion: apps/v1
kind: Deployment
metadata:
  name: egovframe-template-common-components
  labels:
    app.kubernetes.io/name: egovframe-template-common-components
    app.kubernetes.io/part-of: egovframe
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: egovframe-template-common-components
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egovframe-template-common-components
        app.kubernetes.io/part-of: egovframe
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          # 클러스터가 접근할 수 있는 레지스트리의 태그로 바꾼다.
          # 예) ghcr.io/<org>/egovframe-template-common-components:5.1.0
          image: egovframe-template-common-components:5.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # 헬스 경로는 정적 리소스(/css/**)를 사용한다.
          # ROOT('/')와 '/index.do'는 DispatcherServlet/스프링 시큐리티/DB에 의존해
          # 기동 시점에 302(로그인 리다이렉트)나 500을 반환할 수 있어 프로브에 부적합하다.
          # /css/** 는 egov-security-config.properties의 permitAllList에 포함된
          # 정적 경로로, 로그인 없이 200을 반환하고 요청마다 DB 를 조회하지 않는다.
          # 단, 아래 두 경우에는 이 경로도 실패해 파드가 Ready 가 되지 않는다.
          #  - 암호화 키가 배포 기본값 : EgovCryptoKeyGuardFilter(/*)가 503 응답
          #    (이미지 빌드 전에 init-crypto-key 를 실행한다)
          #  - 기동 시점에 DB 연결 실패 : 스프링 컨텍스트 초기화 실패로 404 응답
          startupProbe:
            httpGet:
              path: /css/egovframework/com/com12.css
              port: http
            # 기동이 느린 경우를 대비해 최대 5분(30 x 10s)까지 대기한다.
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /css/egovframework/com/com12.css
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /css/egovframework/com/com12.css
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            - name: tomcat-logs
              mountPath: /usr/local/tomcat/logs
            # 첨부파일 저장 위치 (Globals.fileStorePath, Globals.SynchrnServerPath)
            - name: upload
              mountPath: /upload
      volumes:
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-temp
          emptyDir: {}
        - name: tomcat-logs
          emptyDir: {}
        # emptyDir 는 파드가 재생성되면 비워진다. 첨부파일을 보존하거나 replicas 를 늘리려면
        # PersistentVolumeClaim(다중 파드는 ReadWriteMany)으로 바꾼다.
        - name: upload
          emptyDir: {}
